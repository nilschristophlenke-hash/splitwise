name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run model unit tests
        run: node tests/model.test.js

      # Runs supabase/schema.sql against real Postgres (compiled to WASM, so
      # no database service is needed) and then attacks the row-level security
      # policies as three different users. This is what stops a change to the
      # policies from quietly exposing one group's expenses to another.
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
        working-directory: tests

      - name: Run database security tests
        run: node rls.test.js
        working-directory: tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must be enabled once by hand for this repo:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # Auto-enablement is deliberately not used here: the workflow's built-in
      # token cannot create a Pages site ("Resource not accessible by
      # integration"), so it would only ever fail.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
